name: Release drafter

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Update draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          commitish: dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Group changes and add the release notes
        uses: whereareiam/blockops/primitive/release/draft/regroup@v4
        with:
          release-id: ${{ steps.drafter.outputs.id }}
          release-body: ${{ steps.drafter.outputs.body }}
          developer-prefixes: API
          notes-file: .github/release-notes.md
          version: ${{ steps.drafter.outputs.resolved_version }}
