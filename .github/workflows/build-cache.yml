name: Build cache
run-name: "Build cache of ${{ github.ref_name }}"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests read the caches of dev but never write them, so the checks would compile everything and download
  # Anvil's servers again. A job restores the latest Gradle entry of a job with its own id first, which makes the
  # journey jobs, the longest of the checks, pick this one.
  journeys:
    name: Prepare for the checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The modules compile with a Java 21 toolchain, platform-bukkit-paper with Java 25.
      - uses: whereareiam/devops/primitive/setup/gradle@v3
        with:
          java-version: "25"
          toolchain-versions: "21"

      - uses: whereareiam/anvil-actions/setup@v1

      # Every cacheable task the checks run before their tests.
      - name: Compile the project, its tests and journeys
        run: ./gradlew --no-daemon testClasses anvilClasses assembleDistribution

      # One journey starts Velocity in front of Paper, the servers the suites use, so Anvil saves them for the
      # journey jobs.
      - name: Prepare the servers of the journeys
        run: >-
          ./gradlew --no-daemon :socialismus-testing:anvilPlatformTest
          --tests 'me.whereareiam.socialismus.testing.platform.PlatformStartTest.velocityJarRunsOnVelocity'

