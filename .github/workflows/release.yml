name: Release
run-name: "${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Republish {0}', inputs.release-tag) }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Tag of the existing release to republish to the stores, for example 2.0.0
        required: true
        type: string
      publication:
        description: Publication to republish, for example socialismus-paper-modrinth; empty republishes all of them
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      body: ${{ steps.release.outputs.body }}
      url: ${{ steps.release.outputs.url }}
    steps:
      - name: Read release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          # The stores take the version name from the subtitle and the changelog from the body.
          if jq -e '(.body // "") | contains("[Short subtitle]") or contains("[1-2 sentence summary")' <<<"$release" >/dev/null; then
            echo "::error::Release $TAG still has the subtitle or summary placeholder of the draft; fill in .github/release-notes.md or edit the release, then run this workflow again."
            exit 1
          fi
          delimiter="release-$(openssl rand -hex 16)"
          {
            echo "tag=$(jq -r '.tag_name' <<<"$release")"
            echo "name=$(jq -r '.name // ""' <<<"$release")"
            echo "url=$(jq -r '.html_url' <<<"$release")"
            echo "body<<$delimiter"
            jq -r '.body // ""' <<<"$release"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.tag }}
      distribution: true

  # A manual run only republishes to the stores; Maven and the GitHub release keep what the release published.
  publish:
    name: Publish
    needs: verify
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  attach:
    name: Attach files to the release
    needs: [resolve, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: socialismus-plugins-${{ needs.verify.outputs.version }}
          path: distribution

      - name: Format Spigot release notes
        uses: whereareiam/blockops/primitive/release/notes/format@v4
        with:
          format: bbcode
          release-body: ${{ needs.resolve.outputs.body }}
          output-file: distribution/release-notes-bbcode.txt

      - name: Upload files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" distribution/* --clobber --repo "$GITHUB_REPOSITORY"

  plan:
    name: Plan store publications
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ needs.verify.outputs.version }}
      plan-json: ${{ steps.plan.outputs.plan-json }}
      matrix-json: ${{ steps.plan.outputs.matrix-json }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - id: plan
        uses: whereareiam/blockops/primitive/distribution/plan/resolve@v4
        with:
          release-tag: ${{ needs.resolve.outputs.tag }}
          release-name: ${{ needs.resolve.outputs.name }}
          release-body: ${{ needs.resolve.outputs.body }}
          release-url: ${{ needs.resolve.outputs.url }}
          targets: ${{ inputs.publication }}

  stores:
    name: Publish ${{ matrix.publication.publication }}
    needs: plan
    if: needs.plan.outputs.matrix-json != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        publication: ${{ fromJson(needs.plan.outputs.matrix-json) }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: socialismus-plugins-${{ needs.plan.outputs.version }}
          path: distribution

      - uses: whereareiam/blockops/primitive/distribution/publication/publish@v4
        with:
          provider-credentials: |
            modrinth: ${{ secrets.MODRINTH_TOKEN }}
          plan-json: ${{ needs.plan.outputs.plan-json }}
          artifact-directory: distribution
          publication: ${{ matrix.publication.publication }}
