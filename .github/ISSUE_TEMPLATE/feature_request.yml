name: Suggestion
description: Suggest a new feature, module, or a change to existing behavior.
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How Socialismus could solve it, for players and for admins.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Commands
        - Configuration
        - Integrations
        - Messages
        - Modules
        - Placeholders
        - Platform
        - Synchronization
        - Updates
        - Chirper
        - Bubbler
        - Essentials
        - SocialismusRedis
        - SocialismusChannelizer
        - A new module
        - API
        - Other
