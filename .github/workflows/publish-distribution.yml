name: Publish distribution

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example 2.0.0-RC6
        required: true
        type: string
      targets:
        description: Optional comma-separated provider:variant selectors
        required: false
        default: ""
        type: string
      dry_run:
        description: Resolve and validate without publishing
        required: false
        default: false
        type: boolean
      override_yaml:
        description: Optional YAML override patch applied to resolved metadata
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-distribution-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected distributions
    runs-on: ubuntu-latest
    environment: distribution-publish

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Publish external distributions
        uses: whereareiam/blockops/actions/publish-distribution@v1
        with:
          github-token: ${{ github.token }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          release-tag: ${{ inputs.release_tag }}
          manifest-path: .github/release-distribution.yml
          targets: ${{ inputs.targets }}
          dry-run: ${{ inputs.dry_run }}
          override-yaml: ${{ inputs.override_yaml }}
